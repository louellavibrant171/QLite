name: CI

on:
  push:
    branches: [main]
    # Release tags trigger the installer job below.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install XcodeGen
        run: brew install xcodegen

      # Fails when a translation is missing keys the base language defines, or vice versa.
      - name: Check localization
        run: Scripts/check-localization.sh

      - name: Generate project
        run: xcodegen generate

      - name: Test
        run: |
          xcodebuild test \
            -project QLite.xcodeproj \
            -scheme QLite \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      # Catches problems that only appear with optimisations and code signing on, such as a
      # malformed bundle or a broken extension embed.
      - name: Release build
        run: Scripts/build.sh Release

  installers:
    name: Build installers
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build DMG and PKG
        run: |
          Scripts/make-dmg.sh
          Scripts/make-pkg.sh

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: dist/*
