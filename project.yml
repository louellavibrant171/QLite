name: QLite
options:
  bundleIdPrefix: com.qlite
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.4"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    # Hardened runtime turns on library validation, which requires every binary in the bundle
    # to share one Team ID. Ad-hoc signatures have none, so with it enabled the app cannot load
    # its own embedded QLiteKit.framework and dies at launch. Scripts/build.sh turns it back on
    # when a real Developer ID identity is supplied, where it is required for notarization.
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    COMBINE_HIDPI_IMAGES: YES
    # Local builds are ad-hoc signed so the project builds with no Apple Developer
    # account. For distribution set DEVELOPMENT_TEAM / CODE_SIGN_IDENTITY, see docs.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: ""

targets:
  QLiteKit:
    type: framework
    platform: macOS
    sources:
      - Sources/QLiteKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qlite.QLiteKit
        PRODUCT_NAME: QLiteKit
        GENERATE_INFOPLIST_FILE: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: NO
        DEFINES_MODULE: YES
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies:
      - sdk: libsqlite3.tbd

  QLite:
    type: application
    platform: macOS
    sources:
      - Sources/QLite
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Localization
        buildPhase: resources
    info:
      path: Sources/QLite/Info.plist
      properties:
        CFBundleName: QLite
        CFBundleDisplayName: QLite
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "MIT Licensed. Copyright (c) 2026 QLite contributors."
        NSPrincipalClass: NSApplication
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hans
        CFBundleDocumentTypes:
          - CFBundleTypeName: SQLite Database
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.sqlite.v3
              - public.database
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.sqlite.v3
            UTTypeDescription: SQLite Database
            UTTypeConformsTo:
              - public.data
              - public.database
            UTTypeTagSpecification:
              public.filename-extension:
                - db
                - db3
                - sqlite
                - sqlite3
                - sqlitedb
                - s3db
                - sl3
              public.mime-type:
                - application/vnd.sqlite3
                - application/x-sqlite3
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qlite.QLite
        PRODUCT_NAME: QLite
        CODE_SIGN_ENTITLEMENTS: Sources/QLite/QLite.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The app ships translations for these languages; the QuickLook extensions follow
        # the system language.
        LOCALIZATION_PREFERS_STRING_CATALOGS: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    dependencies:
      - target: QLiteKit
        embed: true
        codeSign: true
      - target: QLitePreview
        embed: true
        codeSign: true
      - target: QLiteThumbnail
        embed: true
        codeSign: true

  QLitePreview:
    type: app-extension
    platform: macOS
    sources:
      - Sources/QLitePreview
      - path: Resources/Localization
        buildPhase: resources
    info:
      path: Sources/QLitePreview/Info.plist
      properties:
        CFBundleName: QLitePreview
        CFBundleDisplayName: QLite Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - org.sqlite.v3
              - public.database
            QLSupportsSearchableItems: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qlite.QLite.Preview
        PRODUCT_NAME: QLitePreview
        CODE_SIGN_ENTITLEMENTS: Sources/QLitePreview/QLitePreview.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../../../../Frameworks"
    dependencies:
      - target: QLiteKit
        embed: false
      - sdk: QuickLookUI.framework
        weak: false

  QLiteThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - Sources/QLiteThumbnail
    info:
      path: Sources/QLiteThumbnail/Info.plist
      properties:
        CFBundleName: QLiteThumbnail
        CFBundleDisplayName: QLite Thumbnail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - org.sqlite.v3
              - public.database
            QLThumbnailMinimumDimension: 16
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qlite.QLite.Thumbnail
        PRODUCT_NAME: QLiteThumbnail
        CODE_SIGN_ENTITLEMENTS: Sources/QLiteThumbnail/QLiteThumbnail.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../../../../Frameworks"
    dependencies:
      - target: QLiteKit
        embed: false
      - sdk: QuickLookThumbnailing.framework

  QLiteKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/QLiteKitTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qlite.QLiteKitTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: QLiteKit

schemes:
  QLite:
    build:
      targets:
        QLite: all
        QLiteKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QLiteKitTests
    archive:
      config: Release
